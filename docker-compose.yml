# Blox AI transcript intake server — production docker-compose.
#
# Coexistence with your other services (pinning-service, fula-api):
#   - Port 8090 published ONLY to 127.0.0.1 (never 0.0.0.0). The nginx
#     reverse proxy on the host is the only path to this service from
#     the public internet. This mirrors the binding pattern your
#     pinning-service install.sh's `harden_infrastructure_bindings`
#     enforces for postgres (5432) and kubo API (5001).
#   - No shared docker network. Stays in its own default bridge so it
#     can't accidentally reach pinning-service's postgres.
#   - Unique container_name ("blox-ai-intake") so `docker ps -f name=…`
#     queries from other install.sh scripts don't false-match.
#
# Hardening (defense in depth — runtime + image layers both enforce):
#   - read_only rootfs; writable tmpfs only where needed
#   - cap_drop ALL — the server needs no capabilities
#   - no-new-privileges — defeat setuid escalation
#   - explicit user 1000:1000 (matches Dockerfile)
#   - mem + pid limits — bound abuse blast radius

services:
  blox-ai-intake:
    image: blox-ai-intake:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blox-ai-intake
    restart: unless-stopped
    user: "1000:1000"

    # ── network surface ──
    # 127.0.0.1 ONLY. nginx reverse-proxies https://ai-training.fx.land/
    # → http://127.0.0.1:8090/ → container's 8000.
    ports:
      - "127.0.0.1:8090:8000"

    # ── filesystem hardening ──
    read_only: true
    tmpfs:
      # /tmp for any stdlib temp file. 16 MB cap.
      - /tmp:size=16m,mode=1777
    volumes:
      # Transcript storage — host-mounted so it survives container
      # recreation + can be backed up/inspected outside Docker. Owned
      # uid 1000:1000 by install.sh.
      - /var/lib/blox-ai-intake/transcripts:/var/lib/blox-ai-intake/transcripts:rw
      # Issue tracker SQLite DB — held in its own host dir so the
      # status-tracked inbox survives container recreation. Same uid
      # ownership. WAL mode is set by issue_db.open_db().
      - /var/lib/blox-ai-intake/db:/var/lib/blox-ai-intake/db:rw

    # ── capability + privilege hardening ──
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # ── resource bounds ──
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 100

    environment:
      # Storage backend lives in /var/lib/... per the host mount.
      - BLOX_AI_STORAGE_DIR=/var/lib/blox-ai-intake/transcripts
      - BLOX_AI_DB_PATH=/var/lib/blox-ai-intake/db/issues.sqlite
      # Trust X-Forwarded-For ONLY because nginx is in front. The TCP
      # peer would always be 127.0.0.1; XFF is the only path to real
      # client IPs for the per-IP rate limiter. nginx's config strips
      # client-supplied XFF before injecting the real one. Admin auth
      # also uses this to attribute failed attempts.
      - BLOX_AI_TRUST_XFF=1
      # Rate limit knobs (defaults match server/app.py).
      - BLOX_AI_RATE_WINDOW_SEC=86400
      - BLOX_AI_RATE_PER_IP=50
      - BLOX_AI_GLOBAL_RATE=10000
      - BLOX_AI_LOG_LEVEL=INFO
      # Bearer token for the /admin/* web UI + API. Auto-generated by
      # install.sh into .env on first run if missing. If unset, all
      # /admin/* endpoints return 503 (admin disabled) — the intake
      # POST /transcripts endpoint still works.
      - BLOX_AI_ADMIN_TOKEN=${BLOX_AI_ADMIN_TOKEN:-}

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
