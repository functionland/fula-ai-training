[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "corpus", "training", "compilation", "publish", "labeller"]

[project]
name = "fula-ai-training"
version = "0.1.0"
description = "Off-device fine-tune pipeline + transcript intake server for the Blox AI model improvement loop."
requires-python = ">=3.10,<3.13"

# Server-side deps (Phase 20 intake)
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "jsonschema>=4.20,<5",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
# Training pipeline deps. Heavy (torch + transformers + peft). Install only
# on the GPU build host that runs the actual fine-tunes.
train = [
    "torch>=2.1,<3",
    "transformers>=4.40,<5",
    "peft>=0.10,<1",
    "datasets>=2.18,<3",
    "accelerate>=0.27,<1",
    "huggingface-hub>=0.20,<1",
]
# Eval + labelling UI deps (lighter; can run anywhere)
eval = [
    "pyyaml>=6.0,<7",
]
labeller = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "jinja2>=3.1,<4",
]
# Dev / test
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "tests"]
addopts = "-ra -q"
