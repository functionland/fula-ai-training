id: oom_kubo_001
description: kubo OOM-killed multiple times. Restart will only buy time; underlying memory pressure needs operator review.

user_prompt: |
  My blox keeps disconnecting every few hours.

canned_diag_responses:
  diag/summary:
    overall: red
    subsystems:
      containers: {status: red, key_metrics: {oom_count: 3, running_count: 5}}
      internet:   {status: green}
      time:       {status: green}
      power:      {status: green}
      storage:    {status: green}
      wireguard:  {status: green}
      heartbeat:  {status: yellow}
      relay:      {status: yellow}
  diag/containers:
    containers:
      - {name: ipfs_host, state: running, oom_killed: true, restart_count: 3}
      - {name: ipfs_cluster, state: running, oom_killed: false, restart_count: 0}

expected:
  severity: red
  root_cause_keywords: [oom, memory, kubo, ipfs_host, killed]
  recommended_actions:
    - action_name: docker.restart
      args: {container: ipfs_host}
      tier: 2

hard_rules:
  max_tool_calls: 3
  no_whitelist_violations: true
