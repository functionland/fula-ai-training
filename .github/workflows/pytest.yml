name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fula-ota for cross-repo schema validation
        uses: actions/checkout@v4
        with:
          repository: functionland/fula-ota
          ref: blox-ai
          path: fula-ota
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval,labeller]"

      - name: pytest
        env:
          BLOX_AI_FULA_OTA_SCHEMA_DIR: ${{ github.workspace }}/fula-ota/docker/fxsupport/linux/plugins/blox-ai/api
        run: pytest -ra -q
