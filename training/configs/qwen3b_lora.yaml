# Phase 19.4 — Qwen 2.5 3B LoRA fine-tune config.
#
# Defaults match the parent plan's section 3.8c. Tune over time based on
# eval reports. Keep this file under version control so the exact
# hyperparams used for any published model are auditable.

base_model:
  hf_id: Qwen/Qwen2.5-3B-Instruct
  # Set to a local path if the GPU box has the weights cached + offline
  local_dir: null

corpus:
  labelled_dir: corpus/labelled
  min_transcripts: 100  # refuse to train on fewer than this

output:
  root: training/output
  # Subdir naming: <YYYYMMDD>-<git-short-sha>
  use_git_sha: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  learning_rate: 2.0e-4
  num_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8       # effective batch = 32
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 25
  save_steps: 200
  save_total_limit: 3
  bf16: true                            # fall back to fp16 if bf16 unsupported
  gradient_checkpointing: true

tokenizer:
  max_length: 4096
  pad_to_multiple_of: 8

evaluation:
  # Held-out fraction split off the labelled corpus for in-training eval.
  # The HARD GATE is the SEPARATE eval_held_out.py against
  # corpus/test_set/, not this number.
  validation_fraction: 0.1
  eval_steps: 100

reproducibility:
  seed: 42

deepspeed:
  enabled: false                        # enable for >24GB VRAM; YAML
  # config_path: training/configs/deepspeed_zero2.json
