# Phase 19.4 — Qwen 3 1.7B LoRA fine-tune config sized for Colab Free T4.
#
# Sibling to qwen3_1_7b_lora.yaml (which is sized for a 24GB A10G/A100).
# This config halves the batch size + quadruples gradient accumulation
# so the effective batch stays at 32, but per-step VRAM usage fits in
# the T4's 15 GB. Output goes to Google Drive so the LoRA adapter
# survives the Colab session ending.
#
# Used by the Colab quickstart notebook flow in training/colab/QUICKSTART.md.

base_model:
  hf_id: Qwen/Qwen3-1.7B
  local_dir: null

corpus:
  labelled_dir: corpus/labelled
  min_transcripts: 100

chat_template:
  enable_thinking: true
  # mask_user_and_tool: TRL 1.5+ moved DataCollatorForCompletionOnlyLM out
  # of the top-level namespace; until we wire the new path, train on the
  # full sequence. Cost: marginal — for narrow tool-call tasks the
  # quality difference vs proper masking is small.
  mask_user_and_tool: false

output:
  # Save to mounted Google Drive so the adapter survives Colab session
  # disconnects. Change to /content/output if you don't want Drive
  # mounting (but then download the adapter before the session ends).
  root: /content/drive/MyDrive/blox-ai-training
  use_git_sha: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  # 2.0e-4 was empirically the sweet spot at effective batch 4 on 2 epochs
  # — converged loss from 3.3 to 0.39 over 78 steps. Lower (1.0e-4) leaves
  # loss high; higher (5.0e-4) shows gradient instability.
  learning_rate: 2.0e-4
  # 2 epochs is the right call for 174 narrow-task examples. 3 epochs
  # risks overfitting on the synthetic phrasings.
  num_epochs: 2
  # T4 fits batch=2 with 4096-token max length + gradient checkpointing.
  # Bump to 4 if you have a Colab Pro V100/L4 (24GB VRAM).
  per_device_train_batch_size: 2
  # Effective batch = 4 (= 2 * 2). The original 32 (grad_accum=16) gave
  # only 5 update steps/epoch on 174 examples — barely any learning.
  # With batch 4 we get ~40 steps/epoch which is what the model actually
  # needs to converge.
  gradient_accumulation_steps: 2
  # Slightly higher warmup for the longer (in step count) training run.
  warmup_ratio: 0.1
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 50
  save_total_limit: 3
  bf16: true                  # T4 supports bf16 since CUDA 11.x
  gradient_checkpointing: true

tokenizer:
  max_length: 4096
  pad_to_multiple_of: 8

evaluation:
  validation_fraction: 0.1
  eval_steps: 50
  # "no" — in-training eval OOMs on T4 (logits.float() in compute_loss
  # tries to allocate ~8 GiB at batch=2, seq_len=4096, vocab=152k).
  # The proper eval is `eval_held_out.py` against `corpus/test_set/`
  # AFTER training — it doesn't fight for VRAM with the training loop.
  # Set to "steps" only on >24 GB GPU.
  strategy: "no"

reproducibility:
  seed: 42

deepspeed:
  enabled: false
