# Phase 19.4 — Qwen 3 1.7B LoRA fine-tune config (sibling to qwen3b_lora.yaml).
#
# Used by `training/train_qwen3_messages.py` (NOT the legacy `lora_train.py`
# which uses a flat prompt+completion format and was written for Qwen 2.5 3B).
#
# Defaults tuned for Qwen 3 1.7B with thinking mode + the synthetic
# corpus generated by `corpus/synthetic/generate.py`. The model has
# fewer parameters than the prior 3B so it's more sensitive to LR;
# rank-16 is plenty for the narrow tool-call + structured-XML task.

base_model:
  # Qwen 3 doesn't use the -Instruct suffix (the Qwen3 family is
  # instruction-tuned by default — only the -Base variant is the
  # non-instruct one). Use Qwen/Qwen3-1.7B for chat / tool-call
  # fine-tuning; Qwen/Qwen3-1.7B-Base if you specifically need the
  # raw pretrained checkpoint.
  hf_id: Qwen/Qwen3-1.7B
  # Set to a local path if the GPU box has the weights cached + offline
  local_dir: null

corpus:
  labelled_dir: corpus/labelled
  min_transcripts: 100  # synthetic corpus ships with ~170; real uploads accumulate over time

# Whether the trainer should treat the corpus dir as containing
# Qwen 3 multi-turn ChatML records (uses apply_chat_template +
# loss-mask on user/system/tool tokens, train only on assistant
# completions). This is what train_qwen3_messages.py expects.
chat_template:
  enable_thinking: true       # Qwen 3 thinking-mode prefix `<think>\n` injected into assistant turn
  mask_user_and_tool: true    # standard SFT — train only on assistant tokens

output:
  root: training/output
  use_git_sha: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # target_modules: Qwen 3's attention block exposes q_proj/k_proj/v_proj/o_proj
  # plus the MLP gate_proj/up_proj/down_proj. We target attention only at rank 16
  # (Anthropic / Qwen team finding: attention LoRA suffices for narrow tool-call
  # tasks; MLP LoRA helps for knowledge injection, which we're not doing).
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  # 1.7B model is more LR-sensitive than 3B; halve the LR for stability.
  learning_rate: 1.0e-4
  num_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4       # effective batch = 32
  warmup_ratio: 0.05                   # slightly higher than 3B (smaller models = more warmup needed)
  weight_decay: 0.0
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 50
  save_total_limit: 3
  bf16: true                            # fall back to fp16 if bf16 unsupported
  gradient_checkpointing: true

tokenizer:
  # Qwen 3 context 32K; we cap at 4096 because synthetic examples are <3500
  # tokens and longer would just waste VRAM.
  max_length: 4096
  pad_to_multiple_of: 8

evaluation:
  # Held-out fraction split off the labelled corpus for in-training eval.
  # The HARD GATE is the SEPARATE eval_held_out.py against
  # corpus/test_set/ (15 hand-authored scenarios).
  validation_fraction: 0.1
  eval_steps: 50

reproducibility:
  seed: 42

deepspeed:
  enabled: false                        # enable for >24GB VRAM
